plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

dependencies {
    implementation 'org.luaj:luaj-jse:3.0.1'
    implementation 'com.android.tools.build:apksig:8.9.2'
    // Rebuilds the user's game classes.dex on the device (org.ignition.recipe.DexRecipe).
    // Pinned: the lab certifies the output with the same version.
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.9'
}

android {
    namespace 'org.ignition.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'org.ignition.launcher'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.0.1'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    def keyProperties = new Properties()
    def keyFile = new File(System.getProperty('user.home'), '.local/share/ignition/signing.properties')
    if (!keyFile.exists()) throw new GradleException('Run bin/fifa-build-launcher to prepare the stable signing key.')
    keyFile.withInputStream { keyProperties.load(it) }
    signingConfigs {
        ignition {
            storeFile file(keyProperties['storeFile'])
            storePassword keyProperties['storePassword']
            keyAlias keyProperties['keyAlias']
            keyPassword keyProperties['keyPassword']
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.ignition }
        release { signingConfig signingConfigs.ignition }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        if (System.getenv('NITION_BUILD_PYTHON')) {
            buildPython System.getenv('NITION_BUILD_PYTHON')
        }
    }
}
